<style>
:root{
  --navy:#111E29; --gold:#BC9B5F; --wine:#571C25; --off:#EAEAEA;
  --muted:#6B7680; --line:#D6D6D6; --page:#F1F1EF; --white:#fff;
  --d:#571C25; --i:#BC9B5F; --s:#4F7A5E; --c:#3F5A73;
  --shadow:0 4px 16px rgba(17,30,41,.10);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --label:"Raleway",system-ui,-apple-system,sans-serif;
  --body:"Montserrat",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{background:var(--page);color:var(--navy);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.1;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.eyebrow{font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:15px;padding:14px 28px;border-radius:6px;transition:transform .2s ease,box-shadow .2s ease,background .2s ease;text-decoration:none;line-height:1.2}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-ghost{border:1px solid var(--navy);color:var(--navy)}
.btn-wa{background:#1F7A4D;color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- cards ---------- */
.card{background:var(--white);border:1px solid #E3E3E0;border-radius:14px;box-shadow:0 2px 10px rgba(17,30,41,.05);padding:24px;margin-bottom:16px}
.card h2{font-size:28px;margin-bottom:4px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.card p{margin-top:12px;font-size:15px}

/* ---------- boas-vindas ---------- */
.hero{background:var(--navy);color:#fff;text-align:center;padding:40px 20px 36px;border-radius:0 0 22px 22px}
.hero img.logo{width:min(210px,58vw);height:auto;display:block;margin:0 auto 18px}
.hero h1{font-size:clamp(32px,8vw,44px);color:#fff;font-weight:400}
.hero .sub{font-family:var(--label);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-top:12px}
.hero .lead{max-width:520px;margin:18px auto 0;font-size:16px;color:#DCE1E5}
.hero .lead+.lead{margin-top:10px;font-size:15px;color:#B8C2CB}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:#fff;border:1px solid #E3E3E0;border-radius:14px;padding:16px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:600;line-height:1;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
.resume{background:#F6EEDC;border:1px solid var(--gold);border-radius:14px;padding:18px;margin-bottom:16px}
.resume b{display:block;margin-bottom:4px}
.resume .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.resume .btn{padding:11px 20px;font-size:14px}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
label.f input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy);font-size:16px}
label.f input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(188,155,95,.25)}
label.f.err input{border-color:var(--wine)}
.err-msg{color:var(--wine);font-size:13px;margin-top:4px;display:none}
label.f.err .err-msg{display:block}
.privacy{font-size:12.5px;color:var(--muted);text-align:center;margin:14px 0 30px}

/* ---------- header e nav do assessment ---------- */
.hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 0 0}
.hdr .in{display:flex;align-items:center;gap:12px;padding:0 16px 10px;max-width:720px;margin:0 auto}
.hdr img{height:34px;width:auto;flex:none}
.hdr .t{flex:1;min-width:0}
.hdr .t small{display:block;font-family:var(--label);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.hdr .t b{display:block;font-family:var(--display);font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .pct{font-family:var(--display);font-size:24px;color:var(--gold);font-weight:600}
.bar{height:4px;background:rgba(255,255,255,.14)}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s ease}
.tag{display:inline-block;font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.nav .in{display:flex;gap:10px;max-width:720px;margin:0 auto}
.nav .btn{flex:1}
.nav .btn.back{flex:0 0 auto}
main.assess{padding-bottom:110px}

/* ---------- perguntas ---------- */
.intro{font-size:14px;color:var(--muted);margin:18px 0 14px}
.sec-title{font-size:32px;margin:6px 0 2px}
.q{background:#fff;border:1px solid #E3E3E0;border-radius:14px;padding:18px;margin-bottom:12px;transition:border-color .2s ease,box-shadow .2s ease}
.q.missing{border-color:var(--wine);box-shadow:0 0 0 3px rgba(87,28,37,.12)}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-weight:500;font-size:15.5px}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:var(--display);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center}
.dw{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #EEE}
.dw:first-of-type{border-top:0}
.dw .w{flex:1;font-size:15px}
.dw button{font-family:var(--label);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:6px;border:1px solid var(--line);color:var(--muted);min-width:64px;transition:all .2s ease}
.dw button.m.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.dw button.l.on{background:var(--wine);border-color:var(--wine);color:#fff}
.dw button:hover{border-color:var(--navy)}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:15px;background:#fff;transition:all .2s ease}
.opt:hover{border-color:var(--gold)}
.opt.on{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.lead{border-left:6px solid var(--bc)}
.opt.lead.on{border-left-color:var(--bc)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);transition:all .2s ease}
.likert button .ln{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.likert button .lt{font-size:9.5px;line-height:1.15;text-align:center;letter-spacing:.01em}
.likert button:hover{border-color:var(--gold)}
.likert button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.likert button.on .ln{color:var(--gold)}

/* ---------- resultados ---------- */
.res-hero{background:var(--navy);color:#fff;border-radius:0 0 22px 22px;padding:30px 20px 26px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.res-hero img{height:64px;width:auto;margin-bottom:10px}
.res-hero h1{font-size:clamp(30px,7vw,40px);font-weight:400;color:#fff}
.res-hero p{color:var(--gold);font-family:var(--label);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;background:var(--navy);color:var(--gold);font-family:var(--display);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.profile h2{font-size:26px;margin:0}
.pill{display:inline-block;font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);background:#F6EEDC;border:1px solid var(--gold);padding:4px 12px;border-radius:999px;margin-top:4px}
.minis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{background:var(--page);border-radius:10px;padding:12px 14px}
.mini small{display:block;font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mini b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15}
.share{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.share .btn{padding:13px 10px;font-size:14px}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.blk{border-radius:12px;padding:14px;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.blk b{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.blk small{display:block;font-family:var(--label);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;margin-bottom:4px}
.blk .bb{height:5px;background:rgba(255,255,255,.28);border-radius:3px;margin-top:10px}
.blk .bb i{display:block;height:100%;background:#fff;border-radius:3px}
.blk.dark-txt{color:var(--navy)}
.blk.dark-txt .bb{background:rgba(17,30,41,.2)}
.blk.dark-txt .bb i{background:var(--navy)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stack i{display:block;height:100%}
.disc-name{font-family:var(--display);font-size:26px;font-weight:600;margin-top:16px}
.code{display:inline-block;font-family:var(--display);font-size:46px;font-weight:600;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:6px 24px;border-radius:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dim{margin-top:16px}
.dim .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.dim .lab span.win{color:var(--navy)}
.dim .lab span{color:var(--muted)}
.dim .tr{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--off)}
.dim .tr i{display:block;height:100%}
.hb{margin-top:10px}
.hb .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.hb .tr{height:10px;background:var(--off);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--gold);border-radius:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hb.top .tr i{background:var(--navy)}
.lead-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.ld{border-radius:12px;padding:14px;border-left:6px solid var(--bc);background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ld b{font-family:var(--display);font-size:32px;font-weight:600;line-height:1}
.ld small{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.beliefs{display:grid;gap:12px;margin-top:14px}
.bel{border:1px solid var(--line);border-radius:12px;padding:16px}
.bel .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bel h3{font-size:22px}
.bel .sc{font-family:var(--display);font-size:32px;font-weight:600;line-height:1}
.bel .sc small{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:400}
.lvl{display:inline-block;font-family:var(--label);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#fff;padding:4px 10px;border-radius:999px;margin-top:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bel p{margin-top:10px;font-size:14.5px}
.radar-wrap{position:relative;width:100%;max-width:520px;margin:12px auto 0;aspect-ratio:1}
.hl{font-size:13.5px;margin-top:10px}
.plan{list-style:none;margin-top:14px}
.plan li{display:flex;gap:14px;padding:14px 0;border-top:1px solid #EEE}
.plan li:first-child{border-top:0}
.plan .em{flex:none;width:38px;height:38px;border-radius:50%;background:var(--page);font-size:20px;display:flex;align-items:center;justify-content:center;font-style:normal}
.plan b{display:block;font-size:15.5px}
.plan div span{font-size:14px;color:#3B4853}
.hbox{margin-top:14px;padding:12px 14px;border-radius:10px;background:#F6EEDC;border:1px solid rgba(188,155,95,.6);font-size:14px;color:var(--navy);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.divlbl{font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:center;margin:4px 0 12px}
.cta{background:var(--navy);color:#fff;border-radius:14px;padding:26px 22px;margin-bottom:16px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cta h2{color:#fff;font-size:30px}
.cta p{color:#DCE1E5;font-size:14.5px;margin:10px 0 18px}
.cta .row{display:grid;gap:10px}
.send-msg{min-height:20px;margin-top:12px;font-size:13.5px;color:#DCE1E5}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 20px}
.redo{text-align:center;margin:0 0 40px}
.redo button{font-size:13px;color:var(--muted);text-decoration:underline}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.noscript{padding:40px 20px;text-align:center}

@media (min-width:600px){
  .minis{grid-template-columns:repeat(4,1fr)}
  .share{grid-template-columns:repeat(4,1fr)}
  .blocks{grid-template-columns:repeat(4,1fr)}
  .cta .row{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  @page{size:A4;margin:9mm}
  body{background:#fff;font-size:12.5px;line-height:1.5}
  .noprint,.hdr,.nav,.toast,.share,.redo,.divlbl{display:none!important}
  .wrap{max-width:none;padding:0}
  .hero,.res-hero{border-radius:0}
  .res-hero{padding:14px 16px 12px;margin-bottom:10px}
  .res-hero img{height:38px;margin-bottom:4px}
  .res-hero h1{font-size:26px}
  .res-hero p{font-size:10.5px;margin-top:4px}
  .wrap[style]{padding-top:0!important}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;padding:14px 16px;margin-bottom:9px}
  .card h2{font-size:21px}
  .card .sub{margin-bottom:8px;font-size:11.5px}
  .card p{margin-top:7px;font-size:12px}
  .profile{margin-bottom:10px}
  .avatar{width:46px;height:46px;font-size:21px}
  .profile h2{font-size:21px}
  .mini{padding:8px 10px}.mini b{font-size:18px}
  .stack{margin-top:8px}
  .blocks{margin-top:8px;gap:8px}
  .blk{padding:9px 11px}.blk b{font-size:26px}
  .dim{margin-top:9px}.code{font-size:34px;padding:3px 18px}
  .hb{margin-top:6px}.hb .lab{font-size:12.5px}
  .lead-grid{gap:8px;margin-top:8px}.ld{padding:9px 11px}.ld b{font-size:24px}
  .hbox{margin-top:8px;padding:8px 11px;font-size:12px}
  .beliefs{gap:8px;margin-top:8px}
  .bel{padding:10px 12px;break-inside:avoid}.bel h3{font-size:18px}.bel .sc{font-size:26px}.bel p{margin-top:6px;font-size:12px}
  .radar-wrap{max-width:410px;margin:0 auto}
  .radar-wrap canvas{width:100%!important;height:100%!important}
  .hl{font-size:12px;margin-top:6px}
  .plan{margin-top:6px}.plan li{padding:7px 0;gap:10px}
  .plan .em{width:30px;height:30px;font-size:16px}
  .plan b{font-size:13px}.plan div span{font-size:11.5px}
  .note{margin:4px 0 0;font-size:10.5px}
}
</style>

   PONTUAÇÃO
   ========================================================= */
function compute(){
  var a=S.a, i, k;
  // DISC
  var raw={D:0,I:0,S:0,C:0};
  for(i=0;i<DISC_G.length;i++){var r=a.disc[i]; if(r&&r.m!==undefined&&r.l!==undefined){raw[DISC_F[r.m]]++;raw[DISC_F[r.l]]--}}
  var disc={}; DISC_F.forEach(function(f){disc[f]=Math.round((raw[f]+16)/32*100)});
  var order=DISC_F.slice().sort(function(x,y){return disc[y]-disc[x]||DISC_F.indexOf(x)-DISC_F.indexOf(y)});
  var pkey=order[0]+order[1];
  var discSum=DISC_F.reduce(function(s,f){return s+disc[f]},0)||1;

  // Jung
  var cnt={E:0,I:0,N:0,S:0,T:0,F:0};
  JUNG_Q.forEach(function(q,i){var v=a.jung[i]; if(v==='a')cnt[q.a[0]]++; else if(v==='b')cnt[q.b[0]]++});
  var jung=JUNG_DIM.map(function(d){
    var x=cnt[d[0]],y=cnt[d[1]],t=(x+y)||1;
    var win=x>y?d[0]:(y>x?d[1]:'X');
    return {l:d[0],r:d[1],ln:d[2],rn:d[3],dn:d[4],lp:Math.round(x/t*100),rp:100-Math.round(x/t*100),win:win,code:win==='X'?d[0]:win};
  });
  var jcode=jung.map(function(d){return d.code}).join('');

  // Valores (0–100)
  var vs={};
  Object.keys(VAL).forEach(function(k){vs[k]=[]});
  VAL_Q.forEach(function(q,i){var v=a.val[i]; if(v!==undefined)vs[q[0]].push(v)});
  var vals=Object.keys(VAL).map(function(k){
    var m=vs[k].reduce(function(s,x){return s+x},0)/(vs[k].length||1);
    return {k:k,n:VAL[k].n,v:Math.round((m-1)/4*100)};
  });
  vals.sort(function(x,y){return y.v-x.v});

  // Liderança
  var lc={E:0,M:0,O:0,S:0};
  for(i=0;i<LEAD_Q.length;i++){var lv=a.lead[i]; if(lv)lc[lv]++}
  var ln=Object.keys(a.lead).length||1;
  var lead={}; LEAD_ORDER.forEach(function(k){lead[k]=Math.round(lc[k]/ln*100)});
  var lsorted=LEAD_ORDER.slice().sort(function(x,y){return lead[y]-lead[x]||LEAD_ORDER.indexOf(x)-LEAD_ORDER.indexOf(y)});
  var ltop=LEAD_ORDER.filter(function(k){return lead[k]===lead[lsorted[0]]});

  // Crenças (0–100, itens reversos invertidos)
  function bscore(id,Q){
    var sum=0,n=0;
    Q.forEach(function(q,i){var v=a[id][i]; if(v===undefined)return; sum+=q[1]?6-v:v; n++});
    return Math.round(((sum/(n||1))-1)/4*100);
  }
  var bel={ide:bscore('ide',IDE_Q),cap:bscore('cap',CAP_Q),abu:bscore('abu',ABU_Q)};

  // Radar: 16 subfatores derivados do DISC e das crenças
  var D=disc.D,I=disc.I,Sx=disc.S,C=disc.C;
  function cl(x){return Math.min(100,x)}
  var rv=[cl(D*.9+8),D,cl((D+C)/2),cl((D+C)/2),cl((I+D)/2),I,cl(I*.9+8),cl((I+Sx)/2),
          cl((Sx+I)/2),Sx,cl((Sx+C)/2),cl(C*.8+Sx*.2),cl((C+Sx)/2),cl(C*.9+5),bel.ide,bel.abu];
  var radar=SUB_NAMES.map(function(n,i){return {n:n,v:Math.round(rv[i])}});

  return {disc:disc,order:order,pkey:pkey,discSum:discSum,jung:jung,jcode:jcode,vals:vals,lead:lead,lsorted:lsorted,ltop:ltop,bel:bel,radar:radar};
}

function bars(items,cls){

function rhead(em,t,s){return '<h2>'+em+' '+esc(t)+'</h2><div class="sub">'+esc(s)+'</div>'}
function topVals(R){return R.vals.filter(function(v){return v.v===R.vals[0].v})}
function valuesText(R){
  var tied=topVals(R);
  var s='Seus valores mais significativos são: <strong>'+R.vals.slice(0,3).map(function(v){return esc(v.n)}).join(', ')+'</strong>. Eles direcionam suas decisões mais profundas e definem o que realmente te move como empresário(a).';
  if(tied.length>1) s+=' Há empate no topo entre '+tied.map(function(v){return '<strong>'+esc(v.n)+'</strong>'}).join(', ').replace(/, ([^,]*)$/,' e $1')+': eles pesam igual para você.';
  else if(R.vals[3]&&R.vals[3].v===R.vals[2].v){
    var edge=R.vals.filter(function(v){return v.v===R.vals[2].v});
    s+=' O 3º lugar está empatado entre '+edge.map(function(v){return '<strong>'+esc(v.n)+'</strong>'}).join(', ').replace(/, ([^,]*)$/,' e $1')+'.';
  }
  return s;
}
function topValName(R){
  var tied=topVals(R);
  return tied.slice(0,2).map(function(v){return v.n}).join(' + ')+(tied.length>2?' +':'');
}

function buildRow(){
  var R=compute(), u=S.user, a=S.a, f=[], i;
  function add(k,v){f.push([k,v==null?'':String(v)])}
  function list(id,n){var t=[];for(i=0;i<n;i++)t.push(a[id][i]===undefined?'':a[id][i]);return t.join(',')}
  var dr=[]; for(i=0;i<DISC_G.length;i++){var r=a.disc[i]||{}; dr.push('M'+(r.m+1)+'L'+(r.l+1))}
  var vmap={}; R.vals.forEach(function(v){vmap[v.k]=v.v});
  add('_form',CFG.aba);
  add('Data',S.done); add('Nome',u.name); add('WhatsApp',u.phone); add('E-mail',u.email);
  add('DISC perfil',R.pkey); add('DISC D',R.disc.D); add('DISC I',R.disc.I); add('DISC S',R.disc.S); add('DISC C',R.disc.C);
  add('Jung tipo',R.jcode);
  R.jung.forEach(function(x){add('Jung '+x.l,x.lp); add('Jung '+x.r,x.rp)});
  Object.keys(VAL).forEach(function(k){add('Valor '+VAL[k].n,vmap[k])});
  add('Valor nº1',topValName(R));
  LEAD_ORDER.forEach(function(k){add('Liderança '+LEAD[k].n,R.lead[k])});
  add('Liderança predominante',R.ltop.map(function(k){return LEAD[k].n}).join(' + '));
  ['ide','cap','abu'].forEach(function(k){add('Crença '+BEL[k].n,R.bel[k]); add('Crença '+BEL[k].n+' nível',level(R.bel[k]).n.replace(/\s\S+$/,''))});
  add('Radar',R.radar.map(function(x){return x.n+':'+x.v}).join('; '));
  add('Respostas DISC',dr.join(' '));
  add('Respostas Jung',list('jung',10));
  add('Respostas Valores',list('val',12));
  add('Respostas Liderança',list('lead',10));
  add('Respostas Identidade',list('ide',8));
  add('Respostas Capacidade',list('cap',8));
  add('Respostas Abundância',list('abu',10));
  return f;
}
var sending=false;
function sendToBase(){
  if(sending) return;
  sending=true; setSendUI('sending');
  var fd=new FormData(); buildRow().forEach(function(x){fd.append(x[0],x[1])});
  fetch(CFG.endpoint,{method:'POST',mode:'no-cors',keepalive:true,body:fd}).then(function(){
    S.sent=new Date().toISOString(); save(); sending=false; setSendUI('sent'); toast('Enviado! Obrigada por responder. ✅');
  },function(){
    sending=false; setSendUI('error'); toast('Não foi possível enviar. Verifique a internet e tente de novo.');
  });
}
function setSendUI(state){
  var b=$('#sendBase'), m=$('#sendMsg'); if(!b) return;
  b.disabled=(state==='sending'||state==='sent');
  b.textContent=state==='sending'?'Enviando…':(state==='sent'?'✅ Resultado enviado':'📲 Enviar resultado para a '+CFG.mentora.split(' ')[0]);
  m.textContent=state==='sent'?('Recebemos o seu resultado em '+fmtDate(S.sent)+'. A '+CFG.mentora.split(' ')[0]+' vai preparar a sua análise.'):(state==='error'?'Falhou o envio. Tente novamente.':'');
}

document.addEventListener('submit',function(e){
  if(e.target.id!=='startForm') return;
  e.preventDefault();
  var f=e.target, name=f.name.value.trim(), mail=f.email.value.trim();
  var okName=name.length>=2, okMail=!mail||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail);
  $('#fName').classList.toggle('err',!okName);
  $('#fMail').classList.toggle('err',!okMail);
  if(!okName){f.name.focus();return}
  if(!okMail){f.email.focus();return}
  S.user={name:name,phone:f.phone.value.trim(),email:mail};
  if(S.done){S.screen='results'}else{S.sec=(totalAnswered()>0)?firstIncompleteSec():0;S.screen='assess'}
  showMiss=false; save(); render(false);
});
document.addEventListener('input',function(e){
  var f=e.target.form; if(!f||f.id!=='startForm') return;
  S.user={name:f.name.value,phone:f.phone.value,email:f.email.value}; save();
});

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var act=b.getAttribute('data-act'), i=+b.getAttribute('data-i');
  switch(act){
    case 'disc':
      var k=+b.getAttribute('data-k'), kind=b.getAttribute('data-kind'), other=kind==='m'?'l':'m';
      var r=S.a.disc[i]||(S.a.disc[i]={});
      if(r[kind]===k){delete r[kind]} else {r[kind]=k; if(r[other]===k) delete r[other]}
      save(); render(true); break;
    case 'opt':
      var sec=b.getAttribute('data-sec'), v=b.getAttribute('data-v');
      S.a[sec][i]=(sec==='jung'||sec==='lead')?v:+v;
      save(); render(true); break;
    case 'next':
      var s=SECS[S.sec], miss=[];
      for(var q=0;q<s.total;q++){if(!isQAnswered(s.id,q)) miss.push(q)}
      if(miss.length){
        showMiss=true; render(true);
        toast('Faltam '+miss.length+(miss.length>1?' respostas':' resposta')+' nesta seção.');
        var el=document.querySelector('[data-q="'+miss[0]+'"]');
        if(el){var top=el.getBoundingClientRect().top+window.scrollY-90; window.scrollTo({top:top,behavior:'smooth'})}
        break;
      }
      showMiss=false;
      if(S.sec<SECS.length-1){S.sec++;save();render(false)}
      else{S.done=new Date().toISOString();S.screen='results';save();render(false)}
      break;
    case 'prev':
      showMiss=false;
      if(S.sec>0){S.sec--;save();render(false)} else go('welcome');
      break;
    case 'resume': S.sec=firstIncompleteSec(); go('assess'); break;
    case 'viewres': go('results'); break;
    case 'restart':
      if(window.confirm('Isso apaga as respostas salvas neste aparelho. Deseja recomeçar do zero?')){
        var u=S.user; S=fresh(); S.user=u; save(); render(false);
      }
      break;
    case 'share-wa': openUrl('https://wa.me/?text='+encodeURIComponent(summary())); break;
    case 'share-mail': location.href='mailto:?subject='+encodeURIComponent('Meu Perfil Comportamental — '+CFG.programa)+'&body='+encodeURIComponent(plain(summary())); break;
    case 'pdf':
      var old=document.title; document.title='Perfil Comportamental · '+S.user.name;
      window.print(); setTimeout(function(){document.title=old},500); break;
    case 'copy':
      var url=appUrl();
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){toast('Link copiado! 🔗')},function(){fallbackCopy(url)});
      } else fallbackCopy(url);
      break;
    case 'send-base': sendToBase(); break;
  }
});
function fallbackCopy(text){
  var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  var ok=false; try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(t);
  toast(ok?'Link copiado! 🔗':'Copie manualmente: '+text);
}
window.addEventListener('load',function(){ if(S.screen==='results') drawRadar() });
window.addEventListener('beforeprint',function(){ if(radarChart) radarChart.resize() });
window.addEventListener('afterprint',function(){ if(radarChart) radarChart.resize() });

render(false);
})();
</script>
